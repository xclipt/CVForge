[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvforge"
version = "0.1.0"
description = "AI-assisted ATS resume authoring toolkit."
requires-python = ">=3.9"

[project.scripts]
cvforge = "cvforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
